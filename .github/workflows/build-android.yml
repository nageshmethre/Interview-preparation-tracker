name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Grant Execute Permission for Gradlew
      run: |
        chmod +x frontend/android/gradlew || true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install --include=dev

    - name: Build and Bundle Web Assets
      run: |
        cd frontend
        npm run build-mobile

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build Android APK
      run: |
        cd frontend/android
        chmod +x gradlew
        ./gradlew :app:assembleDebug --no-daemon
        mkdir -p ../../release-assets
        find . -name "*.apk" -exec cp -v {} ../../release-assets/PrepSpace.apk \;
        ls -la ../../release-assets/

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PrepSpace-Android-App
        path: release-assets/PrepSpace.apk
        if-no-files-found: warn

    - name: Publish Direct Download APK Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: app-latest
        name: PrepSpace Android App
        body: |
          ### PrepSpace Mobile Application (.apk)
          Official Android application for PrepSpace Placement & Interview Preparation Tracker.
          Direct download and instant installation on any Android phone.
        files: release-assets/PrepSpace.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

