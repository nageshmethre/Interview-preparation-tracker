name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Grant Execute Permission for Gradlew
      run: |
        chmod +x frontend/android/gradlew || true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install --include=dev

    - name: Build and Bundle Web Assets
      run: |
        cd frontend
        npm run build-mobile

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build Android APK
      run: |
        cd frontend/android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log || {
          echo "=== BUILD FAILED ==="
          grep -i -E "(error|fail|exception|caused by)" gradle-build.log | tail -n 20 | while IFS= read -r line; do
            echo "::error title=Gradle::$line"
          done
          exit 1
        }

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PrepSpace-Android-App
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

