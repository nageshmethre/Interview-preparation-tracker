<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#0d1124" stroke="url(#streamGrad)" stroke-width="3.5" />
  <!-- Vibrant Stream Flow S-Curve -->
  <path d="M 26 34 C 36 22, 64 22, 74 34 C 80 40, 78 50, 68 54 C 54 59, 44 60, 32 67 C 22 74, 26 84, 38 86 C 52 88, 68 82, 76 70" 
        fill="none" 
        stroke="url(#streamGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
  <!-- Dynamic Fast-Forward Stream Core -->
  <polygon points="45,39 63,49 45,59" fill="url(#accentGrad)" />
  <circle cx="72" cy="32" r="5" fill="#38bdf8" />
  <circle cx="28" cy="70" r="5" fill="#ec4899" />
</svg>
