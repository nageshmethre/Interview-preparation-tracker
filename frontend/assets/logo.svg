<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Premium Big-Tech Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>
    
    <linearGradient id="primaryBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="ambient" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <rect x="25" y="25" width="70" height="70" rx="20" fill="url(#primaryBeam)" opacity="0.3" filter="url(#ambientLight)" />

  <!-- Outer Glassmorphic Obsidian Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="7" y="7" width="106" height="106" rx="27" fill="none" stroke="url(#primaryBeam)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Iconic Monogram Geometry: Interlocking Modern P & Quantum Prism Core -->
  <g transform="translate(10, 8)">
    <!-- Base Left Stem Pillar -->
    <path d="M 28 82 L 28 32 C 28 27.5, 31.5 24, 36 24 L 46 24 C 50.5 24, 54 27.5, 54 32 L 54 82 C 54 86.5, 50.5 90, 46 90 L 36 90 C 31.5 90, 28 86.5, 28 82 Z" 
          fill="url(#accentBeam)" opacity="0.95" />

    <!-- Upper Dimensional P Loop / Launching Prism Chevron -->
    <path d="M 46 24 L 66 24 C 77 24, 86 33, 86 44 C 86 55, 77 64, 66 64 L 46 64 Z" 
          fill="url(#primaryBeam)" filter="url(#coreGlow)" />

    <!-- Inner Negative Space Hex Cutout -->
    <path d="M 50 36 L 64 36 C 68.5 36, 72 39.5, 72 44 C 72 48.5, 68.5 52, 64 52 L 50 52 Z" 
          fill="#0a0e1c" />

    <!-- Dynamic Graduation / Quantum Apex Beacon (Forward Tech Node) -->
    <polygon points="66,44 88,44 77,58" fill="#38bdf8" opacity="0.9" />
    <circle cx="77" cy="44" r="4" fill="#ffffff" filter="url(#coreGlow)" />

    <!-- Crystal Bevel Highlights -->
    <path d="M 36 25 L 46 25 L 46 89 L 36 89 Z" fill="url(#facetHighlight)" />
  </g>
</svg>
