<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="prepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-Tech Shield Container -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#0b0f20" stroke="url(#prepGrad)" stroke-width="3.5" />

  <!-- Modern Stylized Graduation Cap (PrepSpace Diamond) -->
  <polygon points="50,22 82,37 50,52 18,37" fill="url(#capGrad)" stroke="url(#prepGrad)" stroke-width="2" filter="url(#neonGlow)" />
  
  <!-- Lower Skullcap & Tech Code Node Base -->
  <path d="M 30,44 L 30,58 C 30,69 70,69 70,58 L 70,44" fill="none" stroke="url(#prepGrad)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Elegant Tassel & Core Energy Spark -->
  <path d="M 76,39 C 84,47 85,57 85,67" fill="none" stroke="url(#glowGrad)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="85" cy="69" r="3.5" fill="#38bdf8" />
  <circle cx="50" cy="37" r="4" fill="#ffffff" filter="url(#neonGlow)" />
</svg>
