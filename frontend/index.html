  <!-- Bootstrap 5 Bundle JS -->

  <!-- Client-side Cache Invalidation for 19-Domain Curriculum & Modern Reader UI -->
  <script>
    (function() {
      try {
        const CURRENT_DEPLOY_VER = '5.7.2';
        const activeVer = localStorage.getItem('prepspace_client_version');
        if (activeVer !== CURRENT_DEPLOY_VER) {
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) {
                console.log('Clearing old cache bucket:', name);
                caches.delete(name);
              });
            });
          }
          try {
            localStorage.removeItem('prepspace_gamification_state');
          } catch(e) {}
          localStorage.setItem('prepspace_client_version', CURRENT_DEPLOY_VER);
        }
      } catch (err) {}
    })();
  </script>
  <script src="assets/js/questions-data.js?v=5.7.2"></script>

  <script src="assets/js/app.js?v=5.7.2"></script>
  <!-- Service Worker Registration for PWA Offline Support -->
  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=5.7.2').then(reg => {
          console.log('PrepSpace Service Worker registered successfully, scope:', reg.scope);
          // Proactively check for updates immediately
          reg.update();
        }).catch(err => {
          console.warn('Service Worker registration skipped:', err.message);
        });
      });
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>
